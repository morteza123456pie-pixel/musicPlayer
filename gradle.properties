# Project-wide Gradle settings.

# JVM heap for the Gradle daemon — Android builds are memory-hungry;
# 2g avoids OutOfMemoryError on CI runners and most dev machines.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Required: tells AGP to use the AndroidX (androidx.*) libraries
# instead of the old support library. Every dependency in this
# project (Compose, Room, Hilt, Media3, etc.) is AndroidX-only, so
# this MUST be true or the build fails to resolve them correctly.
android.useAndroidX=true

# Enables parallel project execution and configuration caching for
# faster local and CI builds.
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin code style used by the official Kotlin formatter/IDE.
kotlin.code.style=official

# Disables build features not used by this project to speed up
# Gradle sync (view binding / data binding aren't used — Compose only).
android.defaults.buildfeatures.viewbinding=false
android.defaults.buildfeatures.databinding=false

# Non-transitive R classes — recommended by AGP for faster builds in
# multi-module projects and to avoid resource-name collisions later.
android.nonTransitiveRClass=true
