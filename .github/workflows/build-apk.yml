name: Android Build

# Builds a debug APK on every push/PR to main, and lets you trigger it
# manually from the Actions tab. The resulting APK is uploaded as a
# workflow artifact — download it from the run's summary page and
# install it on a device (enable "Install unknown apps" first).
#
# This does NOT publish to the Play Store — it just produces an
# installable .apk file from this repo without needing Android Studio
# installed locally.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate the Gradle project root
        # Handles the case where the Android project was committed as
        # a subfolder (e.g. a "musicplayer/" folder inside the repo)
        # instead of at the repo root — finds the first directory
        # containing settings.gradle.kts and uses it for every step
        # below, so the build doesn't depend on exactly how the repo
        # was pushed.
        id: locate
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" -not -path "*/build/*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Could not find settings.gradle.kts anywhere in the repo (searched 3 levels deep)."
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
          echo "Found Gradle project root: $PROJECT_ROOT"
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Verify Gradle wrapper jar is present
        # gradle/wrapper/gradle-wrapper.jar is committed directly in
        # this repo (matching the Gradle 8.7 pinned in
        # gradle-wrapper.properties), so ./gradlew can download the
        # correct Gradle distribution itself with no extra bootstrap
        # step. This check just fails fast with a clear message if
        # that file is ever accidentally missing/removed, instead of
        # a confusing downstream error.
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing. See README.md for how to regenerate it."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.locate.outputs.root }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicplayer-debug-apk
          path: ${{ steps.locate.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
